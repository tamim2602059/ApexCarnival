workflows:
  apex-carnival-apk:
    name: APEX CARNIVAL APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 20
      java: 17
    scripts:
      - name: 1. Unzip app.zip
        script: |
          set -e
          unzip -oq app.zip || python3 -m zipfile -e app.zip .
          ls -la
      - name: 2. npm install
        script: |
          set -e
          node -v
          java -version
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          npm install --no-audit --no-fund
      - name: 3. Prepare www (game + three.js + fonts)
        script: |
          set -e
          rm -rf www
          mkdir www
          cp index.html www/
          cp node_modules/three/build/three.min.js www/
          for w in 400 500 600 700 800; do
            cp "node_modules/@fontsource/inter/files/inter-latin-${w}-normal.woff2" www/
          done
          ls -la www
      - name: 4. Add Android platform
        script: |
          set -e
          npx cap add android
      - name: 5. Patch Android project
        script: |
          set -e
          bash ./prepare-android.sh
      - name: 6. Capacitor sync
        script: |
          set -e
          npx cap sync android
      - name: 7. Set SDK path
        script: |
          set -e
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > android/local.properties
          cat android/local.properties
      - name: 8. Build debug APK
        script: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
    artifacts:
      - android/app/build/outputs/**/*.apk
