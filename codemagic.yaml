workflows:
  apex-carnival-apk:
    name: APEX CARNIVAL Android APK
    max_build_duration: 40
    instance_type: linux_x2
    environment:
      node: 20
      java: 17
    scripts:
      - name: Unpack project (app.zip)
        script: |
          unzip -oq app.zip || python3 -m zipfile -e app.zip .
          ls
      - name: Put game files into www folder
        script: |
          rm -rf www && mkdir -p www
          cp index.html three.min.js *.woff2 www/
      - name: Install npm packages
        script: npm install
      - name: Add Android platform
        script: npx cap add android
      - name: Prepare (landscape, fullscreen, icon)
        script: bash ./prepare-android.sh
      - name: Sync web files into Android
        script: npx cap sync android
      - name: Set Android SDK path
        script: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build debug APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
