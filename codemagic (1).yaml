workflows:
  android-apk:
    name: APEX CARNIVAL - Android APK
    instance_type: linux_x2          # Linux machine (free plan friendly)
    max_build_duration: 30
    environment:
      node: 20
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Create Android project
        script: |
          npx cap add android
          bash scripts/prepare-android.sh
          npx cap sync android
      - name: Build debug APK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    # Optional: get the APK by email
    # publishing:
    #   email:
    #     recipients:
    #       - you@example.com
